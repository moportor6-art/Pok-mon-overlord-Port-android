name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.5"
  GODOT_TAG: "4.5-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Recuperar el proyecto Godot desde el .pck original (solo la primera vez)
      - name: Recuperar proyecto con GDRE Tools
        id: recover
        if: hashFiles('game/project.godot') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gdre && cd /tmp/gdre
          gh release download -R GDRETools/gdsdecomp -p '*linux*.zip'
          unzip -q *.zip
          GDRE=$(find . -maxdepth 2 -type f -name 'gdre_tools*' | head -1)
          chmod +x "$GDRE"
          cd "$GITHUB_WORKSPACE"
          "/tmp/gdre/$GDRE" --headless --recover=original/index.pck --output="$GITHUB_WORKSPACE/game" \
            || "/tmp/gdre/$GDRE" --headless --recover=original/index.pck --output-dir="$GITHUB_WORKSPACE/game"
          test -f game/project.godot
          rm -rf game/.godot
          ls game

      - name: Guardar proyecto recuperado en el repo
        if: steps.recover.outcome == 'success'
        run: |
          printf '.godot/\n*.import.bak\n' > game/.gitignore
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add game
          git commit -m "Proyecto recuperado desde index.pck (GDRE Tools)"
          git push

      # 2) Ajustes de Android
      - name: Aplicar ajustes de Android
        run: python3 android/apply_android.py game "$(cat VERSION)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3) Godot + plantillas de exportación
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}

      - name: Descargar Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz
          unzip -q Godot_v${GODOT_TAG}_linux.x86_64.zip
          mv Godot_v${GODOT_TAG}_linux.x86_64 godot && chmod +x godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_TAG}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f *.zip *.tpz

      - name: Configurar SDK de Android en Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      # 4) Importar y exportar
      - name: Importar recursos
        run: ~/godot/godot --headless --path game --import || true

      - name: Exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          V=$(cat VERSION)
          ~/godot/godot --headless --path game --export-debug "Android" "$GITHUB_WORKSPACE/build/PokemonOverlord-v$V.apk"
          ls -la build
          test -f "build/PokemonOverlord-v$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PokemonOverlord-apk
          path: build/*.apk

      # 5) Publicar en Releases
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION)
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "Pokémon Overlord Android v$V" --notes "APK compilado automáticamente."
          gh release upload "v$V" build/*.apk --clobber
