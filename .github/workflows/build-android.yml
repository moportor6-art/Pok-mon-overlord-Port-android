name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # para publicar cada versión (la busca el actualizador de la app)

env:
  GODOT_VERSION: "4.5"
  GODOT_TAG: "4.5-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Recuperar el proyecto Godot desde el .pck original (solo la primera vez)
      - name: Recuperar proyecto con GDRE Tools
        id: recover
        if: hashFiles('game/project.godot') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gdre && cd /tmp/gdre
          gh release download -R GDRETools/gdsdecomp -p '*linux*.zip'
          unzip -q *.zip
          GDRE=$(find . -maxdepth 2 -type f -name 'gdre_tools*' | head -1)
          chmod +x "$GDRE"
          cd "$GITHUB_WORKSPACE"
          "/tmp/gdre/$GDRE" --headless --recover=original/index.pck --output="$GITHUB_WORKSPACE/game" \
            || "/tmp/gdre/$GDRE" --headless --recover=original/index.pck --output-dir="$GITHUB_WORKSPACE/game"
          test -f game/project.godot
          rm -rf game/.godot
          ls game

      - name: Guardar proyecto recuperado en el repo
        if: steps.recover.outcome == 'success'
        run: |
          printf '.godot/\n*.import.bak\n' > game/.gitignore
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add game
          git commit -m "Proyecto recuperado desde index.pck (GDRE Tools)"
          git push

      # 2) Huella nativa (antes de tocar project.godot) y ajustes de Android
      - name: Huella nativa
        run: echo "NATIVE=$(python3 android/native_hash.py "$GODOT_TAG")" >> "$GITHUB_ENV"

      - name: Aplicar ajustes de Android
        run: python3 android/apply_android.py game "$(cat VERSION)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3) Godot + plantillas de exportación
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}

      - name: Descargar Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz
          unzip -q Godot_v${GODOT_TAG}_linux.x86_64.zip
          mv Godot_v${GODOT_TAG}_linux.x86_64 godot && chmod +x godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_TAG}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f *.zip *.tpz

      - name: Configurar SDK de Android en Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      # 4) Importar, validar y exportar
      - name: Importar recursos
        run: ~/godot/godot --headless --path game --import || true

      - name: Validar scripts del port
        run: |
          for f in patch_loader touch_nav touch_controls; do
            out=$(~/godot/godot --headless --path game --check-only --script res://port/$f.gd 2>&1 || true)
            echo "$out"
            if echo "$out" | grep -qiE "parse error|script error"; then exit 1; fi
          done

      - name: Plantilla Android (gradle) + 120 Hz + actualizador
        run: |
          rm -rf game/android/build
          mkdir -p game/android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d game/android/build
          echo "${GODOT_VERSION}.stable" > game/android/.build_version
          touch game/android/build/.gdignore
          python3 android/patch_android_build.py game/android/build ${{ github.run_number }} "$NATIVE"

      - name: Exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          APK="PokemonOverlord-v$(cat VERSION)-build-${{ github.run_number }}.apk"
          ~/godot/godot --headless --path game --export-release "Android" "$GITHUB_WORKSPACE/build/$APK"
          test -f "build/$APK"
          ls -la build
          echo "APK=$APK" >> "$GITHUB_ENV"

      # 5) Parche del juego para el actualizador
      - name: Parche del juego (.pck)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(python3 android/find_base.py "$NATIVE" /tmp/base)
          echo "Build base con la misma parte nativa: $BASE"
          EXTRA=""
          if [ "$BASE" != "0" ] && [ -f /tmp/base/base.pck ]; then
            if ~/godot/godot --headless --path game --export-patch "Android" "$GITHUB_WORKSPACE/build/patch.pck" --patches /tmp/base/base.pck \
               && [ -f build/patch.pck ]; then
              EXTRA="--patch build/patch.pck $BASE"
            else
              echo "No se pudo crear el parche: esta versión se ofrecerá como APK completa"
            fi
          else
            ~/godot/godot --headless --path game --export-pack "Android" "$GITHUB_WORKSPACE/build/base.pck"
            test -f build/base.pck
            EXTRA="--base build/base.pck"
          fi
          python3 android/manifest.py ${{ github.run_number }} "$NATIVE" "build/$APK" build/contenido.json $EXTRA
          git log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > build/notas.md
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: PokemonOverlord-apk
          path: build/*.apk

      # 6) Cada compilación se publica como versión: la app la encuentra y se actualiza sola
      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          FILES="build/$APK build/contenido.json"
          [ -f build/patch.pck ] && FILES="$FILES build/patch.pck"
          [ -f build/base.pck ] && FILES="$FILES build/base.pck"
          gh release create "$TAG" $FILES --title "Pokémon Overlord v$(cat VERSION) · build ${{ github.run_number }}" \
            --notes-file build/notas.md --target "${{ github.sha }}" --latest
